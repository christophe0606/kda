solution:
  created-for: CMSIS-Toolbox@2.15.0
  cdefault:
  compiler: AC6

  packs:
    - pack: AlifSemiconductor::Ensemble@2.2.1
    - pack: ARM::CMSIS@6.3.0
    - pack: ARM::CMSIS-Compiler@2.2.0
    - pack: ARM::CMSIS-DSP@1.18.0

  output-dirs:
    tmpdir: build/cmsis/tmp

  target-types:
    - type: DevKit-E8
      board: Alif Semiconductor::DevKit-E8
      device: Alif Semiconductor::AE822FA0E5597LS0
      target-set:
        - set: Release
          images:
            - project-context: kda.Release
            - project-context: M55_HE.Release
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd
        - set: Debug
          images:
            - project-context: kda.Debug
            - project-context: M55_HE.Debug
          debugger:
            name: ULINKplus@pyOCD
            clock: 10000000
            protocol: swd

  build-types:
    - type: Release
      # Retain optimized code plus types/symbols for profiling and capture export.
      debug: on
      optimize: speed
      misc:
        - for-compiler: AC6
          C-CPP:
            - -ffast-math
    - type: Debug
      debug: on
      optimize: none

  projects:
    - project: ./kda.cproject.yml
    - project: ./M55_HE/M55_HE.cproject.yml
