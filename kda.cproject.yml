project:
  device: :M55_HP
  language-C: c11
  misc:
    - for-compiler: AC6
      Link:
        - --xref
        - --symbols
  define:
    - KDA_ALIF_E8
    # FIR mode and memory profile are selected in src/fir_profile.h.
    - PROFILER_USER_CONFIG: '"kda_profiler_config.h"'
  add-path:
    - ./src
    - ./tests

  components:
    - component: CMSIS:DSP&Source
      misc:
        - for-compiler: AC6
          C:
            - -mexecute-only

  groups:
    - group: Application
      misc:
        - for-compiler: AC6
          C:
            - -mexecute-only
      files:
        - file: ./src/main.c
    - group: Independent FIR
      misc:
        - for-compiler: AC6
          C:
            - -mexecute-only
      define:
        - KDA_FIR_REQUIRE_MVE
      files:
        - file: ./src/kda_fir_f32.c
    - group: FIR benchmark calls
      misc:
        - for-compiler: AC6
          C:
            - -mexecute-only
      files:
        - file: ./src/fir_batch_candidate.c
        - file: ./src/fir_batch_baseline.c
        - file: ./src/fir_batch_empty.c
    - group: FIR strict checker
      define:
        - KDA_FIR_TARGET_TESTS
      misc:
        - for-compiler: AC6
          C:
            - -fno-fast-math
            - -ffp-contract=off
            - -mexecute-only
      files:
        - file: ./src/fir_target.c
        - file: ./src/fir_guard.c
        - file: ./src/fir_benchmark.c
        - file: ./tests/fir_oracle.c
        - file: ./tests/test_fir.c

  layers:
    - layer: ./board/DevKit-E8/M55_HP/Board_HP.clayer.yml
      type: Board
    # External dependency: paths are relative to this cproject, not the workspace.
    - layer: ../../cmsis_statistical_profiler/cmsis_statistical_profiler.clayer.yml
    - layer: ../../cmsis_statistical_profiler/adapters/alif_e8/alif_e8.clayer.yml
    - layer: ../../cmsis_statistical_profiler/adapters/alif_e8/alif_e8_utimer.clayer.yml

  output:
    type:
      - elf
      - hex
      - map
