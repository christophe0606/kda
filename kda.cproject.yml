project:
  device: :M55_HP
  language-C: c11
  define:
    - KDA_ALIF_E8
    # 0=demo, 1=FIR numerical, 2=MPU guards, 3=read fault, 4=write fault.
    - KDA_APP_FIR: 1
    - PROFILER_USER_CONFIG: '"kda_profiler_config.h"'
  add-path:
    - ./src
    - ./tests

  components:
    - component: CMSIS:DSP&Source

  groups:
    - group: Application
      files:
        - file: ./src/main.c
    - group: Independent FIR
      define:
        - KDA_FIR_REQUIRE_MVE
      files:
        - file: ./src/kda_fir_f32.c
    - group: FIR strict checker
      define:
        - KDA_FIR_TARGET_TESTS
      misc:
        - for-compiler: AC6
          C:
            - -fno-fast-math
            - -ffp-contract=off
      files:
        - file: ./src/fir_target.c
        - file: ./src/fir_guard.c
        - file: ./tests/fir_oracle.c
        - file: ./tests/test_fir.c

  layers:
    - layer: ./board/DevKit-E8/M55_HP/Board_HP.clayer.yml
      type: Board
    # External dependency: paths are relative to this cproject, not the workspace.
    - layer: ../../cmsis_statistical_profiler/cmsis_statistical_profiler.clayer.yml
    - layer: ../../cmsis_statistical_profiler/adapters/alif_e8/alif_e8.clayer.yml
    - layer: ../../cmsis_statistical_profiler/adapters/alif_e8/alif_e8_utimer.clayer.yml

  output:
    type:
      - elf
      - hex
      - map
